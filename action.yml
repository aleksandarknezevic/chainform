name: "ChainForm Plan"
description: "Detect on-chain configuration drift in CI: run `chainform plan` and fail the job when declared state and live contract state disagree."
author: "ChainForm"

branding:
  icon: "git-pull-request"
  color: "purple"

inputs:
  file:
    description: "Path to the ChainForm configuration file (HCL or JSON)."
    required: false
    default: "chainform.hcl"
  version:
    description: >-
      ChainForm version to run: a release tag such as `v0.0.2`, `latest` to
      resolve the newest release, or `source` to build the checked-out
      repository (requires Go on the runner; used by this repo's own tests).
    required: false
    default: "latest"
  rpc-url:
    description: >-
      JSON-RPC endpoint. Exported as RPC_URL for the config's `env("RPC_URL")`
      lookup. Pass a secret, never a literal. Not needed with `mock: true`.
    required: false
    default: ""
  mock:
    description: "Run against the built-in offline demo reader instead of an RPC endpoint."
    required: false
    default: "false"
  json:
    description: >-
      Also produce the machine-readable plan (`--json`) at `plan-json-file`.
      This runs `plan` a second time, so the chain is read twice.
    required: false
    default: "false"
  fail-on-drift:
    description: >-
      Fail the job when drift is detected (`plan` exits 1). Set to `false` to
      report drift through the `drift` output without failing.
    required: false
    default: "true"
  summary:
    description: "Append the plan to the GitHub job summary."
    required: false
    default: "true"
  working-directory:
    description: "Directory to run in. ABI paths in the config resolve relative to it."
    required: false
    default: "."

outputs:
  drift:
    description: "`true` when drift was detected (managed operations or failed `expect` assertions)."
    value: ${{ steps.plan.outputs.drift }}
  exit-code:
    description: "The `chainform plan` exit code: 0 = no drift, 1 = drift."
    value: ${{ steps.plan.outputs.exit-code }}
  plan-file:
    description: "Path to the human-readable plan output."
    value: ${{ steps.plan.outputs.plan-file }}
  plan-json-file:
    description: "Path to the JSON plan (empty unless `json: true`)."
    value: ${{ steps.plan.outputs.plan-json-file }}
  version:
    description: "The ChainForm version that ran."
    value: ${{ steps.install.outputs.version }}

runs:
  using: composite
  steps:
    - name: Install ChainForm
      id: install
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail

        bindir="${RUNNER_TEMP}/chainform-bin"
        mkdir -p "$bindir"

        if [ "$INPUT_VERSION" = "source" ]; then
          # Build the action's own checkout. Used by this repository's tests and
          # by anyone pinning to an unreleased commit.
          ( cd "$ACTION_PATH" && go build -o "$bindir/chainform" ./cmd/chainform )
          echo "$bindir" >> "$GITHUB_PATH"
          echo "version=source" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        repo="aleksandarknezevic/chainform"
        tag="$INPUT_VERSION"
        if [ "$tag" = "latest" ]; then
          tag=$(curl -fsSL -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${repo}/releases/latest" \
            | grep -m1 '"tag_name"' | cut -d'"' -f4)
        fi
        if [ -z "$tag" ]; then
          echo "::error::could not resolve a ChainForm release for version '$INPUT_VERSION'"
          exit 1
        fi

        case "$RUNNER_OS" in
          Linux) goos=linux; ext="" ;;
          macOS) goos=darwin; ext="" ;;
          Windows) goos=windows; ext=".exe" ;;
          *) echo "::error::unsupported runner OS $RUNNER_OS"; exit 1 ;;
        esac
        case "$RUNNER_ARCH" in
          X64) goarch=amd64 ;;
          ARM64) goarch=arm64 ;;
          *) echo "::error::unsupported runner architecture $RUNNER_ARCH"; exit 1 ;;
        esac

        asset="chainform_${tag#v}_${goos}_${goarch}${ext}"
        base="https://github.com/${repo}/releases/download/${tag}"
        echo "Downloading ${asset} (${tag})"
        curl -fsSL -o "$bindir/${asset}" "${base}/${asset}"

        # Release assets ship a SHA256SUMS file; verify before running a binary
        # that produces multisig calldata.
        if curl -fsSL -o "$bindir/SHA256SUMS" "${base}/SHA256SUMS"; then
          ( cd "$bindir" && grep " ${asset}\$" SHA256SUMS > expected.sha256 \
            && { command -v sha256sum >/dev/null && sha256sum -c expected.sha256 \
                 || shasum -a 256 -c expected.sha256; } )
        else
          echo "::warning::no SHA256SUMS published for ${tag}; skipping checksum verification"
        fi

        mv "$bindir/${asset}" "$bindir/chainform${ext}"
        chmod +x "$bindir/chainform${ext}"
        echo "$bindir" >> "$GITHUB_PATH"
        echo "version=${tag}" >> "$GITHUB_OUTPUT"

    - name: chainform plan
      id: plan
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        RPC_URL: ${{ inputs.rpc-url }}
        INPUT_FILE: ${{ inputs.file }}
        INPUT_MOCK: ${{ inputs.mock }}
        INPUT_JSON: ${{ inputs.json }}
        INPUT_SUMMARY: ${{ inputs.summary }}
        INPUT_FAIL_ON_DRIFT: ${{ inputs.fail-on-drift }}
      run: |
        set -uo pipefail

        args=(plan -f "$INPUT_FILE")
        if [ "$INPUT_MOCK" = "true" ]; then
          args+=(--mock)
        fi

        plan_file="${RUNNER_TEMP}/chainform-plan.txt"
        chainform "${args[@]}" | tee "$plan_file"
        code=${PIPESTATUS[0]}

        json_file=""
        if [ "$INPUT_JSON" = "true" ]; then
          json_file="${RUNNER_TEMP}/chainform-plan.json"
          chainform "${args[@]}" --json > "$json_file" || true
        fi

        drift=false
        if [ "$code" -eq 1 ]; then
          drift=true
        elif [ "$code" -ne 0 ]; then
          # Anything other than 0/1 is a real failure (bad config, RPC error).
          echo "::error::chainform plan failed with exit code ${code}"
          exit "$code"
        fi

        {
          echo "drift=${drift}"
          echo "exit-code=${code}"
          echo "plan-file=${plan_file}"
          echo "plan-json-file=${json_file}"
        } >> "$GITHUB_OUTPUT"

        if [ "$INPUT_SUMMARY" = "true" ]; then
          {
            echo "### ChainForm plan (\`${INPUT_FILE}\`)"
            echo
            if [ "$drift" = "true" ]; then
              echo "Drift detected."
            else
              echo "No drift."
            fi
            echo
            echo '```'
            cat "$plan_file"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        fi

        if [ "$drift" = "true" ] && [ "$INPUT_FAIL_ON_DRIFT" = "true" ]; then
          echo "::error::ChainForm detected drift in ${INPUT_FILE}"
          exit 1
        fi
